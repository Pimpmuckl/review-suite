name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.14"

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest plugins/review-suite/tests -q

      - name: Syntax check scripts
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem -LiteralPath plugins/review-suite/scripts -Filter *.py -File
            Get-ChildItem -LiteralPath plugins/review-suite/scripts/review_suite_core -Filter *.py -File
          )
          python -m py_compile @($files.FullName)
