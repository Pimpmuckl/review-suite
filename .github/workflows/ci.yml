name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} / Python 3.14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.14"
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
          persist-credentials: false
          set-safe-directory: false
          show-progress: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.26"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked

      - parallel:
          - name: Run tests
            shell: pwsh
            run: |
              $profileArgs = @()
              if ($env:RUNNER_OS -eq "Windows") {
                $profileArgs = @("--durations=100", "--durations-min=0.25", "--junitxml=pytest-profile.xml")
              }
              uv run --locked pytest -n auto --dist=worksteal @profileArgs plugins/review-suite/tests -q

          - name: Syntax check scripts
            shell: pwsh
            run: |
              $files = @(
                Get-ChildItem -LiteralPath plugins/review-suite/scripts -Filter *.py -File
                Get-ChildItem -LiteralPath plugins/review-suite/scripts/review_suite_core -Filter *.py -File
              )
              uv run --locked python -m py_compile @($files.FullName)

      - name: Summarize Windows pytest profile
        if: runner.os == 'Windows' && always()
        shell: pwsh
        run: |
          if (!(Test-Path -LiteralPath pytest-profile.xml)) {
            Write-Host "pytest-profile.xml missing"
            exit 0
          }
          @'
          from collections import defaultdict
          import xml.etree.ElementTree as ET

          root = ET.parse("pytest-profile.xml").getroot()
          cases = []
          by_module = defaultdict(float)
          for case in root.iter("testcase"):
              seconds = float(case.get("time") or 0)
              classname = case.get("classname") or "<unknown>"
              name = case.get("name") or "<unknown>"
              cases.append((seconds, classname, name))
              by_module[classname] += seconds

          print("Top Windows pytest cases:")
          for seconds, classname, name in sorted(cases, reverse=True)[:30]:
              print(f"{seconds:7.3f}s {classname}::{name}")

          print("\nTop Windows pytest modules:")
          for classname, seconds in sorted(by_module.items(), key=lambda item: item[1], reverse=True)[:20]:
              print(f"{seconds:7.3f}s {classname}")
          '@ | uv run --locked python -
