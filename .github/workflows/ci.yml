name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.14"

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.22"
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run --locked pytest plugins/review-suite/tests -q

      - name: Syntax check scripts
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem -LiteralPath plugins/review-suite/scripts -Filter *.py -File
            Get-ChildItem -LiteralPath plugins/review-suite/scripts/review_suite_core -Filter *.py -File
          )
          uv run --locked python -m py_compile @($files.FullName)
