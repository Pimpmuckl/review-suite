  ["gpt-5.6-luna-medium", "gpt-5.6-luna-high", "gpt-6-astra-low", "gpt-5.6-sol-medium"],
  ["gpt-5.6-luna-high", "gpt-5.6-luna-xhigh", "gpt-6-astra-medium", "gpt-5.5-xhigh"],
