# Shipped defaults. User overrides: ~/.codex/state/review-suite/settings.toml
# All jobs use normal except final deep signoff, which uses deep.

[normal]
model = "gpt-6-astra"
reasoning = "medium"

[deep]
model = "gpt-6-astra"
reasoning = "xhigh"

# Optional per-job overrides inherit omitted fields from normal/deep:
# [jobs.deslop]
# model = "gpt-5.6-luna"
# Jobs: plan, deslop, followup, normal_signoff, deep_signoff. service_tier may also be set (fast/flex).
