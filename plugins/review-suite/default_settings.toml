# Shipped defaults. User overrides: ~/.codex/state/review-suite/settings.toml
# All jobs use normal except PR-gate discovery, which uses deep.

[normal]
model = "gpt-5.6-sol"
reasoning = "medium"

[deep]
model = "gpt-6-astra"
reasoning = "high"

# Optional per-job overrides inherit omitted fields from normal/deep:
# [jobs.deslop]
# model = "gpt-5.6-luna"
# Jobs: plan, deslop, followup, phase_discovery, pr_discovery,
# normal_signoff, deep_signoff. service_tier may also be set (fast/flex).

# Workflow and Arena settings.
[privacy]
arena_external_publish_enabled = false

[arena]
enabled = false

[arena.pools.discovery_phase]
rating_pool_id = "discovery-phase-gpt-5.6-v1"
variant_groups = [
  ["gpt-5.5-medium", "gpt-5.6-sol-medium", "gpt-5.6-terra-medium", "gpt-5.6-luna-medium"],
]

[arena.pools.discovery_deep]
rating_pool_id = "discovery-deep-gpt-5.6-v1"
variant_groups = [
  ["gpt-5.5-xhigh", "gpt-5.6-sol-xhigh", "gpt-5.6-terra-xhigh", "gpt-5.6-luna-xhigh"],
]

[arena.pools.arena_phase]
rating_pool_id = "arena-phase-gpt-5.6-v1"
reporting = true
variant_ids = ["gpt-5.5-low", "gpt-5.5-medium", "gpt-5.6-luna-medium", "gpt-5.6-luna-high", "gpt-5.6-luna-xhigh", "gpt-5.6-luna-max", "gpt-5.6-terra-medium", "gpt-5.6-terra-high", "gpt-5.6-terra-xhigh", "gpt-5.6-sol-low", "gpt-5.6-sol-medium", "gpt-6-astra-low", "gpt-6-astra-medium"]
variant_groups = [
  ["gpt-5.5-low", "gpt-5.5-medium", "gpt-5.6-luna-high", "gpt-5.6-sol-low"],
  ["gpt-5.5-medium", "gpt-5.6-luna-medium", "gpt-5.6-luna-xhigh", "gpt-5.6-sol-medium"],
  ["gpt-5.6-luna-medium", "gpt-5.6-luna-high", "gpt-5.6-luna-max", "gpt-6-astra-low"],
  ["gpt-5.6-luna-high", "gpt-5.6-luna-xhigh", "gpt-5.6-terra-medium", "gpt-6-astra-medium"],
  ["gpt-5.6-luna-xhigh", "gpt-5.6-luna-max", "gpt-5.6-terra-high", "gpt-5.6-luna-medium"],
  ["gpt-5.6-luna-max", "gpt-5.6-terra-medium", "gpt-5.6-terra-xhigh", "gpt-5.6-terra-high"],
  ["gpt-5.6-terra-medium", "gpt-5.6-terra-high", "gpt-5.6-sol-low", "gpt-5.5-low"],
  ["gpt-5.6-terra-high", "gpt-5.6-terra-xhigh", "gpt-5.6-sol-medium", "gpt-5.5-medium"],
  ["gpt-5.6-terra-xhigh", "gpt-5.6-sol-low", "gpt-6-astra-low", "gpt-5.6-luna-medium"],
  ["gpt-5.6-sol-low", "gpt-5.6-sol-medium", "gpt-6-astra-medium", "gpt-5.6-luna-high"],
  ["gpt-5.6-sol-medium", "gpt-6-astra-low", "gpt-5.5-low", "gpt-5.6-luna-xhigh"],
